name: Build and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_type:
        description: Version update type
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: |
          echo "::notice title=INFO::Running type checks, lint, and tests before publishing"
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Update version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_TYPE="${{ github.event.inputs.version_type }}"
          if [[ -z "$VERSION_TYPE" ]]; then
            VERSION_TYPE="patch"
          fi

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$VERSION_TYPE" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
            *)
              echo "::error title=ERROR::Unsupported version type: $VERSION_TYPE"
              exit 1
              ;;
          esac

          node -e "const fs = require('node:fs'); const pkg = require('./package.json'); pkg.version = '$NEW_VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n')"

          git add package.json
          git commit -m "Bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice title=INFO::Updated @toxicflow-labs/ts-sdk from $CURRENT_VERSION to $NEW_VERSION"

      - name: Build package
        run: |
          echo "::notice title=INFO::Building @toxicflow-labs/ts-sdk@${{ steps.version.outputs.version }}"
          pnpm build

      - name: Verify package contents
        run: |
          echo "::notice title=INFO::Checking the npm package contents before publishing"
          pnpm publish --dry-run --access public --no-git-checks

      - name: Push version commit and tag
        run: |
          echo "::notice title=INFO::Pushing version commit and v${{ steps.version.outputs.version }} tag"
          git push
          git push --tags

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::notice title=INFO::Publishing @toxicflow-labs/ts-sdk@${{ steps.version.outputs.version }} to npm"
          pnpm publish --access public --no-git-checks
